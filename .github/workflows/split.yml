name: Split Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: core
            repository_name: cmf-core
          - local_path: users
            repository_name: cmf-module-users
          - local_path: roles
            repository_name: cmf-module-roles
          - local_path: auditing
            repository_name: cmf-module-auditing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split branch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: danharrin/monorepo-split-github-action@v2.4.0
        with:
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: quansitech
          repository_name: ${{ matrix.package.repository_name }}
          branch: main
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Split tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: danharrin/monorepo-split-github-action@v2.4.0
        with:
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: quansitech
          repository_name: ${{ matrix.package.repository_name }}
          branch: main
          tag: ${{ github.ref_name }}
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
